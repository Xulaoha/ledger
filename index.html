<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账本">
<title>记账本</title>
<style>
:root {
  --bg:#eef1f4; --card:#fff; --ink:#1b2733; --mute:#66737f; --line:#d9dfe5;
  --in:#1f7a55; --out:#c4452f; --acc:#2f5da8; --accbg:#e4ebf7;
  color-scheme:light;
  padding-top:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#11161c; --card:#1a212a; --ink:#e6ebf0; --mute:#93a0ac; --line:#2b3541;
    --in:#4cc38a; --out:#ef7a65; --acc:#7ea6ea; --accbg:#22314a; color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#11161c; --card:#1a212a; --ink:#e6ebf0; --mute:#93a0ac; --line:#2b3541;
  --in:#4cc38a; --out:#ef7a65; --acc:#7ea6ea; --accbg:#22314a; color-scheme:dark;
}
*, *::before, *::after { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif }
body.sheet-open { position:fixed; inset-inline:0; overflow:hidden }
main { max-width:720px; margin:auto; padding:12px 12px calc(88px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3, p { margin:0 }
h1 { color:var(--mute); font-size:14px; font-weight:600 }
h2 { font-size:16px }
h3 { font-size:14px }
.total { font-size:clamp(30px, 9vw, 42px); font-weight:700; margin-bottom:8px }
.money { font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px }
.panel > h2 { margin-bottom:8px }
button, input, textarea, summary { font:inherit }
button, summary { cursor:pointer; min-width:44px; min-height:44px }
button { color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; overflow-wrap:anywhere }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px }
button.primary, .fab { background:var(--acc); color:var(--card); border-color:var(--acc); font-weight:700 }
button.secondary { color:var(--acc); font-weight:600 }
button.icon { width:44px; padding:0; font-size:21px; line-height:1 }
button.quiet { border-color:transparent; background:transparent; color:var(--mute) }
input, textarea { width:100%; min-width:0; min-height:44px; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 }
input[type="date"] { display:block; appearance:none; -webkit-appearance:none }
textarea { margin:8px 0; resize:vertical; min-height:92px }
label, legend { color:var(--mute); font-size:14px }
label { display:grid; gap:4px; min-width:0 }
.in { color:var(--in) }
.out { color:var(--out) }
.empty, .status { color:var(--mute); font-size:14px }
.status:not(:empty) { margin-top:6px }
.accs, .sum, .tile-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px }
.accs > *, .sum > *, .tile-grid > * { min-width:0 }
.acc-card { display:grid; grid-template-columns:minmax(0,1fr) 44px; align-items:center; column-gap:2px; padding:3px 3px 3px 8px; border:1px solid var(--line); border-radius:8px }
.acc-name { display:block; color:var(--mute); font-size:13px; overflow-wrap:anywhere }
.acc-card b { display:block; font-size:17px }
.add-account { border:1px dashed var(--acc); background:var(--accbg); color:var(--acc); font-weight:600; min-height:52px }
.account-form { margin-top:8px }
.fields { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px }
.account-form .fields, .managed-row { grid-template-columns:minmax(0,1fr) auto; align-items:end }
.nav { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:-4px 0 4px }
.month { text-align:center }
.month small, .sum small, .tile small { display:block; color:var(--mute); font-size:13px }
.nav h2 { margin:0; line-height:1.25 }
.sum > div, .tile { background:var(--bg); border-radius:8px; padding:5px 9px }
.sum b { display:block; font-size:17px }
.category-block + .category-block { margin-top:14px }
.category-block h3 { margin-bottom:6px }
.tile-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.tile { aspect-ratio:1; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:10px; overflow-wrap:anywhere }
.tile b { font-size:19px }
.more { width:100%; margin-top:8px }
.day { display:flex; justify-content:space-between; gap:8px; color:var(--mute); font-size:13px; margin:10px 0 0; padding-bottom:4px; border-bottom:1px solid var(--line); overflow-wrap:anywhere }
.tx { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; align-items:center; gap:5px; padding:2px 0; overflow-wrap:anywhere }
.tx .money { font-weight:600; max-width:32vw; text-align:right }
.tx small { display:block; color:var(--mute); font-size:13px }
.transfer-note { font-size:13px; margin-top:8px }
.settings { padding-block:0 }
summary { display:flex; align-items:center; justify-content:space-between; gap:8px; list-style:none; font-weight:700 }
summary::-webkit-details-marker { display:none }
summary::after { content:""; border-right:2px solid var(--mute); border-bottom:2px solid var(--mute); width:8px; height:8px; transform:rotate(45deg); margin:0 4px 4px 0 }
details[open] > summary::after { transform:rotate(225deg); margin-bottom:0 }
.settings-content { padding-bottom:12px }
.managed-row { display:grid; gap:8px; padding:8px 0; border-bottom:1px solid var(--line) }
.managed-row:last-child { border-bottom:0; padding-bottom:0 }
.managed-row label { overflow-wrap:anywhere }
.actions { display:flex; flex-wrap:wrap; gap:8px }
.fab-wrap { position:fixed; bottom:12px; right:calc(12px + env(safe-area-inset-right, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px); z-index:2 }
.fab { width:56px; height:56px; padding:0; border-radius:50%; font-size:28px; line-height:1 }
.toast { position:fixed; z-index:3; bottom:calc(76px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); max-width:calc(100% - 24px); border-radius:8px; padding:8px 14px; color:var(--card); background:var(--ink); text-align:center; pointer-events:none }
.sheet { position:fixed; inset:0; width:100%; height:100%; max-width:none; max-height:none; margin:0; border:0; padding:0; background:transparent; color:var(--ink); overflow:hidden }
.sheet[open] { display:flex; justify-content:center; align-items:flex-end }
.sheet::backdrop { background:var(--ink); opacity:.5 }
.sheet-panel { width:min(100%, 600px); max-height:90vh; max-height:90dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--card); border:1px solid var(--line); border-bottom:0; border-radius:16px 16px 0 0; padding:0 12px calc(12px + env(safe-area-inset-bottom, 0px)) }
.sheet-header { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center; min-height:50px; background:var(--card); margin-bottom:6px }
.sheet form { display:grid; gap:10px }
fieldset { margin:0; padding:0; border:0; min-width:0 }
legend { padding:0; margin-bottom:4px }
.choices { display:grid; gap:5px; grid-template-columns:repeat(3,minmax(0,1fr)) }
.cat-choices { grid-template-columns:repeat(4,minmax(0,1fr)) }
.choice { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; padding:5px 3px; font-size:14px; line-height:1.25 }
.choice small { font-size:12px; color:var(--mute); line-height:1.25 }
.choice[aria-pressed="true"] { background:var(--accbg); border-color:var(--acc); color:var(--acc); font-weight:700 }
.choice[aria-pressed="true"] small { font-weight:400 }
#entry-msg:not(:empty) { color:var(--out) }
#entry-msg:empty { display:none }
@media (max-width:360px) { .cat-choices { grid-template-columns:repeat(3,minmax(0,1fr)) } }
</style>
</head>
<body>
<main>
  <h1>总资产（所有账户合计）</h1>
  <p class="total money" id="total">0.00</p>

  <section class="panel" aria-labelledby="accounts-title">
    <h2 id="accounts-title">账户</h2>
    <div class="accs" id="accs">
      <button class="add-account" type="button" id="show-account-form" aria-expanded="false" aria-controls="account-form">＋ 添加账户</button>
    </div>
    <form class="account-form" id="account-form" novalidate hidden>
      <div class="fields">
        <label>新账户名称<input id="newacc" placeholder="如：日常银行卡" aria-describedby="account-msg" required enterkeyhint="done"></label>
        <button class="secondary" type="submit">添加账户</button>
      </div>
    </form>
    <p class="status" id="account-msg" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="mlabel">
    <div class="nav">
      <button class="icon" type="button" id="prev" aria-label="上个月">‹</button>
      <div class="month"><h2 id="mlabel"></h2><small>月度汇总</small></div>
      <button class="icon" type="button" id="next" aria-label="下个月">›</button>
    </div>
    <div class="sum">
      <div><small>收入</small><b class="money in" id="s-in"></b></div>
      <div><small>支出</small><b class="money out" id="s-out"></b></div>
      <div><small>日均支出</small><b class="money" id="s-avg"></b></div>
      <div><small>结余</small><b class="money" id="s-net"></b></div>
    </div>
  </section>

  <section class="panel" id="stats" hidden aria-label="分类统计">
    <div class="category-block" id="expense-stats">
      <h3>支出分类</h3><div class="tile-grid" id="expense-tiles"></div>
      <button class="more secondary" type="button" id="expense-more" aria-controls="expense-tiles" aria-expanded="false" hidden>展开全部</button>
    </div>
    <div class="category-block" id="income-stats">
      <h3>收入来源</h3><div class="tile-grid" id="income-tiles"></div>
      <button class="more secondary" type="button" id="income-more" aria-controls="income-tiles" aria-expanded="false" hidden>展开全部</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="list-title">
    <h2 id="list-title" tabindex="-1">明细</h2>
    <div id="list"></div>
    <button class="more secondary" type="button" id="days-more" aria-controls="list" aria-expanded="false" hidden>展开更多</button>
    <p class="empty transfer-note">账户之间的转账不计入收入和支出。</p>
  </section>

  <details class="panel settings" id="account-management">
    <summary>账户管理</summary>
    <div class="settings-content">
      <div id="managed-accounts"></div>
      <p class="status" id="managed-msg" role="status"></p>
    </div>
  </details>
  <details class="panel settings" id="backup">
    <summary>备份</summary>
    <div class="settings-content">
      <p class="empty">账本数据保存在当前浏览器。换设备或清理浏览器前，请先生成并保存备份。</p>
      <textarea id="bk" aria-label="备份内容" spellcheck="false"></textarea>
      <div class="actions"><button type="button" id="exp">生成备份</button><button type="button" id="imp">从上面的内容恢复</button></div>
      <p class="status" id="backup-msg" role="status"></p>
    </div>
  </details>
</main>

<div class="fab-wrap"><button class="fab" type="button" id="open-entry" aria-label="记一笔" aria-haspopup="dialog">＋</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog class="sheet" id="entry" aria-labelledby="entry-title">
  <div class="sheet-panel" id="entry-panel">
    <header class="sheet-header"><h2 id="entry-title">记一笔</h2><button class="quiet" type="button" id="close-entry" autofocus>关闭</button></header>
    <form id="entry-form" novalidate>
      <div class="choices" id="seg" role="group" aria-label="记账类型">
        <button class="choice" type="button" data-type="expense" aria-pressed="true">支出</button>
        <button class="choice" type="button" data-type="income" aria-pressed="false">收入</button>
        <button class="choice" type="button" data-type="transfer" aria-pressed="false">转账</button>
      </div>
      <div class="fields">
        <label>金额<input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label>
        <label>日期<input id="date" type="date" required></label>
      </div>
      <fieldset><legend id="t-acc">从哪个账户付</legend><div class="choices" id="acc"></div></fieldset>
      <fieldset id="l-to" hidden><legend>转入账户</legend><div class="choices" id="to"></div></fieldset>
      <fieldset id="l-cat"><legend id="t-cat">分类</legend><div class="choices cat-choices" id="cat"></div></fieldset>
      <label>备注<input id="note" placeholder="可不填"></label>
      <p class="status" id="entry-msg" role="alert"></p>
      <button class="primary" type="submit" id="add">记下</button>
    </form>
  </div>
</dialog>
<script>
const STORAGE_KEY = 'ledger-v1';
const EXPENSE = ['餐饮','外卖','购物','交通','娱乐','游戏','订阅','其他','医疗','日用','居住','学习','人情红包','数码','直播成本'];
const INCOME = ['工资','直播','外卖返利','其他','理财收益','退款'];
const CATEGORY_HINTS = new Map([
  ['外卖','通过外卖平台下的单'],
  ['餐饮','堂食、买菜、奶茶咖啡、零食'],
  ['游戏','游戏充值、买游戏、游戏周边'],
  ['娱乐','电影、KTV、演出、玩乐（不含游戏）'],
  ['居住','房租、水电、网费、话费'],
  ['直播成本','直播相关的设备、软件、道具开销'],
  ['理财收益','余额宝、小荷包等的收益']
]);
const $ = id => document.getElementById(id);
const money = n => (Object.is(n, -0) ? 0 : n).toLocaleString('zh-CN', {
  minimumFractionDigits:2, maximumFractionDigits:2
});
const pad = n => String(n).padStart(2, '0');
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// Put all displayed data in text nodes or form values, so it is never parsed as HTML.
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function button(text, className, run) {
  const node = element('button', text, className);
  node.type = 'button';
  node.addEventListener('click', run);
  return node;
}
function isLedger(value) {
  return Array.isArray(value?.accounts) && Array.isArray(value?.tx) &&
    value.accounts.every(a => a && ['number','string'].includes(typeof a.id) && typeof a.name === 'string') &&
    value.tx.every(t => t && ['number','string'].includes(typeof t.id) && typeof t.date === 'string' &&
      ['expense','income','transfer'].includes(t.type) && Number.isFinite(Number(t.amt)));
}
function load() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (isLedger(value)) return value;
  } catch {}
  return {accounts:[{id:'a1',name:'微信',open:0},{id:'a2',name:'余额宝',open:0},{id:'a3',name:'小荷包',open:0}],tx:[]};
}
let state = load();
let month = today().slice(0, 7);
let type = 'expense';
let source;
let destination;
const selectedCategory = {expense:EXPENSE[0], income:INCOME[0]};
const expanded = {expense:false, income:false, days:false};
const storageError = '未能保存，请确认浏览器允许此网站存储数据后再试。';
let savedScroll = 0;
let toastTimer;
function save(next) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  } catch {
    return false;
  }
  state = next;
  return true;
}
function showToast(text) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.classList.add('toast');
  toast.textContent = text;
  toastTimer = setTimeout(() => {
    toast.classList.remove('toast');
    toast.textContent = '';
  }, 2000);
}
function balances() {
  const result = new Map(state.accounts.map(a => [a.id, Number(a.open) || 0]));
  function add(id, amount) {
    if (result.has(id)) result.set(id, result.get(id) + amount);
  }
  for (const t of state.tx) {
    const amount = Number(t.amt);
    add(t.acc, t.type === 'income' ? amount : -amount);
    if (t.type === 'transfer') add(t.to, amount);
  }
  return result;
}
function renderAccounts() {
  const result = balances();
  const addAccount = $('show-account-form');
  const cards = state.accounts.map(a => {
    const card = element('div', undefined, 'acc-card');
    const info = element('div');
    info.append(element('span', a.name, 'acc-name'), element('b', money(result.get(a.id)), 'money'));
    const manage = button('⋯', 'icon quiet', () => {
      $('account-management').open = true;
      const row = $('managed-accounts').children[state.accounts.indexOf(a)];
      row.scrollIntoView({block:'center'});
      row.focus({preventScroll:true});
    });
    manage.setAttribute('aria-label', `管理账户 ${a.name}`);
    card.append(info, manage);
    return card;
  });
  for (const card of $('accs').querySelectorAll('.acc-card')) card.remove();
  addAccount.before(...cards);
  $('total').textContent = money([...result.values()].reduce((sum, value) => sum + value, 0));
}
function renderManagement() {
  $('managed-accounts').replaceChildren(...state.accounts.map(a => {
    const row = element('div', undefined, 'managed-row');
    row.tabIndex = -1;
    const label = element('label', `${a.name} · 起始余额`);
    const input = element('input');
    input.type = 'number';
    input.step = '0.01';
    input.inputMode = 'decimal';
    input.value = Number(a.open) || 0;
    input.addEventListener('change', () => {
      const open = Number(input.value) || 0;
      const accounts = state.accounts.map(account => account.id === a.id ? {...account, open} : account);
      if (save({...state, accounts})) {
        renderAccounts();
        $('managed-msg').textContent = '已更新起始余额。';
      } else {
        input.value = state.accounts.find(account => account.id === a.id).open;
        $('managed-msg').textContent = storageError;
      }
    });
    const remove = button('删除账户', 'quiet', () => {
      const status = $('managed-msg');
      if (state.tx.some(t => t.acc === a.id || t.to === a.id)) {
        status.textContent = '这个账户已有记录，不能删除。';
      } else if (state.accounts.length < 2) {
        status.textContent = '至少保留一个账户。';
      } else if (save({...state, accounts:state.accounts.filter(account => account.id !== a.id)})) {
        renderAccounts();
        renderManagement();
        $('account-management').querySelector('summary').focus();
        status.textContent = '已删除账户。';
      } else {
        status.textContent = storageError;
      }
    });
    remove.setAttribute('aria-label', `删除账户 ${a.name}`);
    label.append(input);
    row.append(label, remove);
    return row;
  }));
}
function setAccountForm(open) {
  $('account-form').hidden = !open;
  $('show-account-form').setAttribute('aria-expanded', String(open));
  if (open) $('newacc').focus();
}
$('show-account-form').addEventListener('click', () => {
  $('account-msg').textContent = '';
  setAccountForm($('account-form').hidden);
});
$('newacc').addEventListener('input', () => {
  $('newacc').removeAttribute('aria-invalid');
  $('account-msg').textContent = '';
});
$('account-form').addEventListener('submit', event => {
  event.preventDefault();
  const field = $('newacc');
  const name = field.value.trim();
  if (!name) {
    $('account-msg').textContent = '请先输入新账户名称。';
    field.setAttribute('aria-invalid', 'true');
    field.focus();
    return;
  }
  const id = 'a' + crypto.getRandomValues(new Uint32Array(2)).join('-');
  if (!save({...state, accounts:[...state.accounts, {id,name,open:0}]})) {
    $('account-msg').textContent = storageError;
    return;
  }
  field.value = '';
  setAccountForm(false);
  renderAccounts();
  renderManagement();
  $('show-account-form').focus({preventScroll:true});
  $('account-msg').textContent = `已添加「${name}」。`;
});

function setMore(id, hasMore, isOpen, text) {
  const control = $(id);
  control.hidden = !hasMore;
  control.textContent = isOpen ? '收起' : text;
  control.setAttribute('aria-expanded', String(isOpen));
}
function renderCategories(kind, amounts, total) {
  const rows = [...amounts].sort((a, b) => b[1] - a[1]);
  $(kind + '-stats').hidden = !rows.length;
  const visible = expanded[kind] ? rows : rows.slice(0, 6);
  const amountClass = kind === 'income' ? 'money in' : 'money out';
  $(kind + '-tiles').replaceChildren(...visible.map(([name, amount]) => {
    const tile = element('div', undefined, 'tile');
    const share = total ? `${(amount / total * 100).toLocaleString('zh-CN', {maximumFractionDigits:1})}%` : '0%';
    tile.append(element('span', name), element('b', money(amount), amountClass), element('small', share));
    return tile;
  }));
  setMore(kind + '-more', rows.length > 6, expanded[kind], '展开全部');
}
function renderTransactions(transactions) {
  const groups = new Map();
  const accounts = new Map(state.accounts.map(a => [a.id, a.name]));
  const accountName = id => accounts.get(id) ?? '已删除账户';
  for (const t of [...transactions].sort((a, b) => b.date.localeCompare(a.date) || Number(b.id) - Number(a.id))) {
    if (!groups.has(t.date)) groups.set(t.date, []);
    groups.get(t.date).push(t);
  }
  const visible = expanded.days ? [...groups] : [...groups].slice(0, 7);
  const days = visible.map(([date, entries]) => {
    const group = element('div', undefined, 'day-group');
    const header = element('h3', undefined, 'day');
    const expense = entries.reduce((sum, t) => sum + (t.type === 'expense' ? Number(t.amt) : 0), 0);
    header.append(element('span', date));
    if (expense) header.append(element('span', `支出 ${money(expense)}`, 'money'));
    group.append(header);
    for (const t of entries) {
      const category = t.cat ?? '未分类';
      const row = element('div', undefined, 'tx');
      const transfer = t.type === 'transfer';
      const title = element('div', t.note || (transfer ? '账户间转账' : category));
      const from = accountName(t.acc);
      title.append(element('small', transfer ? `转账 ${from} → ${accountName(t.to)}` : `${category} · ${from}`));
      const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '';
      const amount = element('span', sign + money(Number(t.amt)), transfer ? 'money' : 'money ' + (t.type === 'income' ? 'in' : 'out'));
      const remove = button('×', 'icon quiet', () => {
        if (save({...state, tx:state.tx.filter(entry => entry !== t)})) {
          renderAccounts();
          renderMonth();
          $('list-title').focus({preventScroll:true});
        } else {
          showToast(storageError);
        }
      });
      remove.setAttribute('aria-label', '删除这笔');
      row.append(title, amount, remove);
      group.append(row);
    }
    return group;
  });
  $('list').replaceChildren(...(days.length ? days : [element('p', '这个月还没有记录。', 'empty')]));
  setMore('days-more', groups.size > 7, expanded.days, '展开更多');
}
function renderMonth() {
  const [year, selectedMonth] = month.split('-').map(Number);
  $('mlabel').textContent = `${year}年${pad(selectedMonth)}月`;
  const transactions = state.tx.filter(t => t.date.slice(0, 7) === month);
  const amounts = {expense:new Map(), income:new Map()};
  const totals = {expense:0, income:0};
  for (const t of transactions) {
    if (t.type === 'transfer') continue;
    const category = t.cat ?? '未分类';
    const amount = Number(t.amt);
    const bucket = amounts[t.type];
    bucket.set(category, (bucket.get(category) ?? 0) + amount);
    totals[t.type] += amount;
  }
  const now = today();
  const days = now.slice(0, 7) === month ? Number(now.slice(8)) : new Date(year, selectedMonth, 0).getDate();
  const net = Math.round((totals.income - totals.expense) * 100) / 100;
  $('s-in').textContent = money(totals.income);
  $('s-out').textContent = money(totals.expense);
  $('s-avg').textContent = money(totals.expense / days);
  $('s-net').textContent = money(net);
  $('s-net').classList.toggle('in', net > 0);
  $('s-net').classList.toggle('out', net < 0);
  $('stats').hidden = !amounts.expense.size && !amounts.income.size;
  renderCategories('expense', amounts.expense, totals.expense);
  renderCategories('income', amounts.income, totals.income);
  renderTransactions(transactions);
}
function resetExpansion() {
  expanded.expense = expanded.income = expanded.days = false;
}
function shiftMonth(offset) {
  const [year, selectedMonth] = month.split('-').map(Number);
  const date = new Date(year, selectedMonth - 1 + offset, 1);
  month = `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
  resetExpansion();
  renderMonth();
}
$('prev').addEventListener('click', () => shiftMonth(-1));
$('next').addEventListener('click', () => shiftMonth(1));
for (const kind of ['expense','income','days']) {
  $(kind + '-more').addEventListener('click', () => {
    expanded[kind] = !expanded[kind];
    renderMonth();
    if (!expanded[kind]) $(kind + '-more').scrollIntoView({block:'nearest'});
  });
}

function renderChoices(id, options, current, select) {
  const group = $(id);
  const previousFocus = [...group.children].indexOf(document.activeElement);
  group.replaceChildren(...options.map(({value, label, hint}) => {
    const choice = button(label, 'choice', () => {
      select(value);
      $('entry-msg').textContent = '';
      if (document.activeElement !== choice) choice.focus({preventScroll:true});
      renderEntry();
    });
    if (hint) choice.append(element('small', hint));
    choice.setAttribute('aria-pressed', String(current === value));
    return choice;
  }));
  if (previousFocus >= 0) group.children[previousFocus]?.focus({preventScroll:true});
}
function renderEntry() {
  const accounts = state.accounts.map(a => ({value:a.id, label:a.name}));
  if (!accounts.some(a => a.value === source)) source = accounts[0]?.value;
  if (!accounts.some(a => a.value === destination) || destination === source) {
    destination = accounts.find(a => a.value !== source)?.value;
  }
  const transfer = type === 'transfer';
  $('l-to').hidden = !transfer;
  $('l-cat').hidden = transfer;
  $('t-acc').textContent = transfer ? '转出账户' : type === 'income' ? '收入到' : '从哪个账户付';
  $('t-cat').textContent = type === 'income' ? '收入来源' : '分类';
  for (const tab of $('seg').children) tab.setAttribute('aria-pressed', String(tab.dataset.type === type));
  renderChoices('acc', accounts, source, value => { source = value; });
  if (transfer) {
    const targets = accounts.filter(a => a.value !== source);
    renderChoices('to', targets, destination, value => { destination = value; });
  } else {
    const categories = type === 'income' ? INCOME : EXPENSE;
    renderChoices('cat', categories.map(label => ({value:label,label,hint:CATEGORY_HINTS.get(label)})),
      selectedCategory[type], value => { selectedCategory[type] = value; });
  }
}
$('seg').addEventListener('click', event => {
  const next = event.target.closest('button')?.dataset.type;
  if (!next) return;
  type = next;
  $('entry-msg').textContent = '';
  renderEntry();
});
const sheet = $('entry');
$('open-entry').addEventListener('click', () => {
  if (sheet.open) return;
  savedScroll = window.scrollY;
  document.body.style.top = `-${savedScroll}px`;
  document.body.classList.add('sheet-open');
  renderEntry();
  $('entry-msg').textContent = '';
  $('entry-panel').scrollTop = 0;
  sheet.showModal();
});
function closeEntry() {
  sheet.close();
  document.body.classList.remove('sheet-open');
  document.body.style.removeProperty('top');
  window.scrollTo(0, savedScroll);
  $('open-entry').focus({preventScroll:true});
}
$('close-entry').addEventListener('click', closeEntry);
sheet.addEventListener('cancel', event => {
  event.preventDefault();
  closeEntry();
});
let shadePress = false;
sheet.addEventListener('pointerdown', event => { shadePress = event.target === sheet; });
sheet.addEventListener('click', event => {
  if (shadePress && event.target === sheet) closeEntry();
  shadePress = false;
});
$('entry-form').addEventListener('submit', event => {
  event.preventDefault();
  const amount = Math.round(Number($('amt').value) * 100) / 100;
  const message = $('entry-msg');
  if (!(amount > 0) || !Number.isFinite(amount)) {
    message.textContent = '请先填写大于 0 的金额。';
    $('amt').focus();
    return;
  }
  if (source === undefined) {
    message.textContent = '请先添加账户。';
    return;
  }
  if (type === 'transfer' && (destination === undefined || source === destination)) {
    message.textContent = '转账需要两个不同的账户。';
    return;
  }
  const date = $('date').value || today();
  const ids = new Set(state.tx.map(t => String(t.id)));
  let id = Date.now();
  while (ids.has(String(id))) id++;
  const tx = {id, date, type, amt:amount, acc:source, note:$('note').value.trim()};
  if (type === 'transfer') tx.to = destination;
  else tx.cat = selectedCategory[type];
  if (!save({...state, tx:[...state.tx, tx]})) {
    message.textContent = storageError;
    return;
  }
  const entryMonth = date.slice(0, 7);
  if (month !== entryMonth) resetExpansion();
  month = entryMonth;
  $('amt').value = $('note').value = '';
  closeEntry();
  renderAccounts();
  renderMonth();
  showToast('已记下');
});

$('exp').addEventListener('click', () => {
  const backup = $('bk');
  backup.value = JSON.stringify(state);
  backup.focus();
  backup.select();
  $('backup-msg').textContent = '备份已生成，可以复制保存。';
});
$('imp').addEventListener('click', () => {
  const status = $('backup-msg');
  let backup;
  try {
    backup = JSON.parse($('bk').value);
    if (!isLedger(backup)) throw new Error();
  } catch {
    status.textContent = '备份内容无法识别，请检查后再试。';
    return;
  }
  if (!save(backup)) {
    status.textContent = storageError;
    return;
  }
  resetExpansion();
  renderAccounts();
  renderManagement();
  renderMonth();
  status.textContent = '已从备份恢复。';
});
$('date').value = today();
renderAccounts();
renderManagement();
renderMonth();
</script>
</body>
</html>
