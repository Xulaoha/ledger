<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账本">
<title>记账本</title>
<style>
:root {
  --bg:#eef1f4; --card:#fff; --ink:#1b2733; --mute:#66737f; --line:#d9dfe5;
  --in:#1f7a55; --out:#c4452f; --acc:#2f5da8; --accbg:#e4ebf7;
  --chart-1:#18457e; --chart-2:#6695ce; --chart-3:#2e619f; --chart-4:#8bb0d9;
  --chart-5:#457ab9; --chart-6:#a9c6e5; --chart-7:#254e8d; --chart-8:#567ead;
  color-scheme:light;
  padding-top:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#11161c; --card:#1a212a; --ink:#e6ebf0; --mute:#93a0ac; --line:#2b3541;
    --in:#4cc38a; --out:#ef7a65; --acc:#7ea6ea; --accbg:#22314a; color-scheme:dark;
    --chart-1:#b1cff9; --chart-2:#527eb9; --chart-3:#92b8ed; --chart-4:#4269a1;
    --chart-5:#749fdf; --chart-6:#365685; --chart-7:#a1b8db; --chart-8:#6586b0;
  }
}
:root[data-theme="dark"] {
  --bg:#11161c; --card:#1a212a; --ink:#e6ebf0; --mute:#93a0ac; --line:#2b3541;
  --in:#4cc38a; --out:#ef7a65; --acc:#7ea6ea; --accbg:#22314a; color-scheme:dark;
  --chart-1:#b1cff9; --chart-2:#527eb9; --chart-3:#92b8ed; --chart-4:#4269a1;
  --chart-5:#749fdf; --chart-6:#365685; --chart-7:#a1b8db; --chart-8:#6586b0;
}
*, *::before, *::after { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif }
body.sheet-open { position:fixed; inset-inline:0; overflow:hidden }
main { max-width:720px; margin:auto; padding:12px 12px calc(88px + env(safe-area-inset-bottom, 0px)) }
h1, h2, h3, p { margin:0 }
h1 { color:var(--mute); font-size:14px; font-weight:600 }
h2 { font-size:16px }
h3 { font-size:14px }
.total { font-size:clamp(30px, 9vw, 42px); font-weight:700; margin-bottom:8px }
.money { font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px }
.panel > h2 { margin-bottom:8px }
button, input, textarea, summary { font:inherit }
button, summary { cursor:pointer; min-width:44px; min-height:44px }
button { color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; overflow-wrap:anywhere }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px }
button.primary, .fab { background:var(--acc); color:var(--card); border-color:var(--acc); font-weight:700 }
button.secondary { color:var(--acc); font-weight:600 }
button:disabled { color:var(--mute); opacity:.55; cursor:default }
button.icon { width:44px; padding:0; font-size:21px; line-height:1 }
button.quiet { border-color:transparent; background:transparent; color:var(--mute) }
input, textarea { width:100%; min-width:0; min-height:44px; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 }
input[type="date"] { display:block; appearance:none; -webkit-appearance:none }
textarea { margin:8px 0; resize:vertical; min-height:92px }
label, legend { color:var(--mute); font-size:14px }
label { display:grid; gap:4px; min-width:0 }
.in { color:var(--in) }
.out { color:var(--out) }
.empty, .status { color:var(--mute); font-size:14px }
.status:not(:empty) { margin-top:6px }
.accs, .sum { display:grid; grid-template-columns:repeat(2,1fr); gap:6px }
.accs > *, .sum > * { min-width:0 }
.acc-card { display:grid; grid-template-columns:minmax(0,1fr) 44px; align-items:center; column-gap:2px; padding:3px 3px 3px 8px; border:1px solid var(--line); border-radius:8px }
.acc-name { display:block; color:var(--mute); font-size:13px; overflow-wrap:anywhere }
.acc-card b { display:block; font-size:17px }
.add-account { border:1px dashed var(--acc); background:var(--accbg); color:var(--acc); font-weight:600; min-height:52px }
.account-form { margin-top:8px }
.fields { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px }
.account-form .fields, .managed-row { grid-template-columns:minmax(0,1fr) auto; align-items:end }
.nav { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:-4px 0 4px }
.month { text-align:center }
.month small, .sum small { display:block; color:var(--mute); font-size:13px }
.month button { padding:2px 8px; font-weight:700 }
.nav h2 { margin:0; line-height:1.25 }
.sum > div { background:var(--bg); border-radius:8px; padding:5px 9px }
.sum b { display:block; font-size:17px }
.more { width:100%; margin-top:8px }
.day { display:flex; justify-content:space-between; gap:8px; color:var(--mute); font-size:13px; margin:10px 0 0; padding-bottom:4px; border-bottom:1px solid var(--line); overflow-wrap:anywhere }
.tx { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; align-items:center; gap:5px; padding:2px 0; overflow-wrap:anywhere }
.tx.expense-row { grid-template-columns:minmax(0,1fr) auto 44px 44px }
.tx .money { font-weight:600; max-width:32vw; text-align:right }
.tx small { display:block; color:var(--mute); font-size:13px }
.transfer-note { font-size:13px; margin-top:8px }
.settings { padding-block:0 }
summary { display:flex; align-items:center; justify-content:space-between; gap:8px; list-style:none; font-weight:700 }
summary::-webkit-details-marker { display:none }
summary::after { content:""; border-right:2px solid var(--mute); border-bottom:2px solid var(--mute); width:8px; height:8px; transform:rotate(45deg); margin:0 4px 4px 0 }
details[open] > summary::after { transform:rotate(225deg); margin-bottom:0 }
.settings-content { padding-bottom:12px }
.managed-row { display:grid; gap:8px; padding:8px 0; border-bottom:1px solid var(--line) }
.managed-row:last-child { border-bottom:0; padding-bottom:0 }
.managed-row label { overflow-wrap:anywhere }
.actions { display:flex; flex-wrap:wrap; gap:8px }
.fab-wrap { position:fixed; bottom:12px; right:calc(12px + env(safe-area-inset-right, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px); z-index:2 }
.fab { width:56px; height:56px; padding:0; border-radius:50%; font-size:28px; line-height:1 }
.toast { position:fixed; z-index:3; bottom:calc(76px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); max-width:calc(100% - 24px); border-radius:8px; padding:8px 14px; color:var(--card); background:var(--ink); text-align:center; pointer-events:none }
.sheet { position:fixed; inset:var(--entry-top, 0px) 0 auto; width:100%; height:var(--entry-height, 100%); max-width:none; max-height:none; margin:0; border:0; padding:0; background:transparent; color:var(--ink); overflow:hidden }
.sheet[open] { display:flex; justify-content:center; align-items:flex-end }
.sheet::backdrop { background:var(--ink); opacity:.5 }
.sheet-panel { display:flex; flex-direction:column; width:min(100%, 600px); max-height:90%; overflow:hidden; background:var(--card); border:1px solid var(--line); border-bottom:0; border-radius:16px 16px 0 0 }
.sheet-header { display:flex; justify-content:space-between; align-items:center; min-height:50px; padding-inline:12px }
.sheet form { display:flex; flex-direction:column; min-height:0 }
.entry-scroll { display:grid; gap:8px; padding:4px 12px 12px; min-height:0; overflow:auto; overscroll-behavior:contain }
.entry-footer { flex:none; padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); border-top:1px solid var(--line); background:var(--card) }
.entry-footer .primary { width:100% }
.entry-footer .status:not(:empty) { margin:0 0 4px }
.date-shortcuts { display:flex; gap:4px }
.date-shortcuts button { flex:1; padding-inline:2px }
fieldset { margin:0; padding:0; border:0; min-width:0 }
legend { padding:0; margin-bottom:4px }
.choices { display:grid; gap:5px; grid-template-columns:repeat(3,minmax(0,1fr)) }
.cat-choices { grid-template-columns:repeat(4,minmax(0,1fr)) }
.choice { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; padding:5px 3px; font-size:14px; line-height:1.25 }
.choice[aria-pressed="true"], .choice[aria-selected="true"] { background:var(--accbg); border-color:var(--acc); color:var(--acc); font-weight:700 }
.cat-choices { grid-auto-rows:1fr }
.category-hint, .chart-note { color:var(--mute); font-size:12px; margin-top:6px }
.check-row { display:flex; gap:6px; align-items:center; min-height:44px; font-size:14px; cursor:pointer }
.check-row input { flex:none; width:44px; min-width:44px; height:44px; padding:0; appearance:none; display:grid; place-items:center; background:none; border:0; cursor:pointer }
.check-row input::before { content:""; width:36px; height:22px; border:1px solid var(--mute); background:var(--bg); border-radius:12px; grid-area:1/1 }
.check-row input::after { content:""; width:14px; height:14px; background:var(--mute); border-radius:50%; grid-area:1/1; transform:translateX(-7px) }
.check-row input:checked::before { background:var(--acc); border-color:var(--acc) }
.check-row input:checked::after { background:var(--card); transform:translateX(7px) }
.demo-banner { background:var(--accbg); color:var(--ink); padding:8px 12px; border-radius:8px; margin-bottom:8px }
.guide { font-size:14px }
.stats-heading, .stats-tools, .detail-heading, .day-controls { display:flex; justify-content:space-between; align-items:center; gap:6px }
.stat-tabs { grid-template-columns:repeat(4,minmax(0,1fr)); margin-block:4px 10px }
.stats-tools { flex-wrap:wrap; margin-bottom:6px }
.stats-tools .choices { display:flex; margin-inline-start:auto }
.stats-tools .choice { padding-inline:8px }
.chart-figure { margin:8px auto; max-width:536px; position:relative }
.chart-plot { position:relative }
.chart-figure svg { display:block; width:100%; height:auto; overflow:visible }
.chart-figure .donut { width:min(100%, 232px); margin:auto }
.chart-figure .daily-svg { touch-action:pan-y }
.chart-figure .daily-svg, .chart-figure .donut { cursor:pointer }
.chart-figure text { fill:var(--mute); font-size:11px; font-variant-numeric:tabular-nums }
.chart-figure .chart-value { fill:var(--ink); font-weight:600 }
.chart-figure .chart-grid { stroke:var(--line); stroke-width:1 }
.chart-figure .average-line { stroke:var(--out); stroke-width:1.5; stroke-dasharray:4 4 }
.chart-figure .selected-bar { fill:var(--acc) }
.chart-tooltip { position:absolute; z-index:1; width:max-content; max-width:100%; padding:6px 8px; background:var(--accbg); border:1px solid var(--line); color:var(--ink); border-radius:8px; font-size:14px; overflow-wrap:anywhere; pointer-events:none }
.month-hits { position:absolute; inset:0; display:grid; grid-template-columns:repeat(6,1fr) }
.month-hits button { background:transparent; border-color:transparent; padding:0 }
.rank-list { display:grid; gap:4px; margin-top:8px }
.rank-row { width:100%; display:grid; grid-template-columns:28px minmax(0,1fr) auto auto; align-items:center; gap:6px; padding:5px; text-align:left }
.rank-row .money { max-width:38vw; text-align:right }
.rank-row[aria-pressed="true"] { border-color:var(--acc); background:var(--accbg) }
.rank-badge { display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--accbg); color:var(--ink); font-size:12px }
.rank-name { display:grid; gap:4px; overflow-wrap:anywhere }
.rank-track { height:3px; border-radius:4px; overflow:hidden; background:var(--line) }
.rank-track i { display:block; height:100% }
.rank-percent { font-size:12px; color:var(--mute) }
.asset-row, .top-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:6px; padding:8px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere }
.asset-row:last-child, .top-row:last-child { border-bottom:0 }
.asset-row small, .top-row small { display:block; color:var(--mute); font-size:12px }
.asset-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:6px }
.stat-detail { border-top:1px solid var(--line); margin-top:12px; padding-top:4px }
.tx-title { min-width:0 }
.tx-flag { color:var(--mute); background:transparent; border-color:transparent; padding:2px 0; font-size:12px }
.tx-flag[aria-pressed="true"] { color:var(--acc); background:var(--accbg) }
.top-tag { color:var(--acc); margin-inline-start:6px; font-size:12px }
#entry-msg:not(:empty) { color:var(--out) }
#entry-msg:empty { display:none }
@media (max-width:420px) { .cat-choices { grid-template-columns:repeat(3,minmax(0,1fr)) } }
</style>
</head>
<body>
<main>
  <p class="demo-banner" id="demo-banner" hidden>演示模式：数据不会保存，去掉网址里的 ?demo=1 即可回到正常使用</p>
  <h1>总资产（所有账户合计）</h1>
  <p class="total money" id="total">0.00</p>
  <section class="panel guide" id="guide" aria-labelledby="guide-title" hidden>
    <h2 id="guide-title">开始记账</h2>
    <p>第一步：点账户卡片右上角的“⋯”，设置每个账户现在的余额。</p>
    <p>第二步：点右下角的＋记第一笔。</p>
  </section>

  <section class="panel" aria-labelledby="accounts-title">
    <h2 id="accounts-title">账户</h2>
    <div class="accs" id="accs">
      <button class="add-account" type="button" id="show-account-form" aria-expanded="false" aria-controls="account-form">＋ 添加账户</button>
    </div>
    <form class="account-form" id="account-form" novalidate hidden>
      <div class="fields">
        <label>新账户名称<input id="newacc" placeholder="如：日常银行卡" aria-describedby="account-msg" required enterkeyhint="done"></label>
        <button class="secondary" type="submit">添加账户</button>
      </div>
    </form>
    <p class="status" id="account-msg" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="mlabel">
    <div class="nav">
      <button class="icon" type="button" id="prev" aria-label="上个月">‹</button>
      <div class="month"><h2><button class="quiet" type="button" id="mlabel" title="回到本月"></button></h2><small>月度汇总</small></div>
      <button class="icon" type="button" id="next" aria-label="下个月">›</button>
    </div>
    <div class="sum">
      <div><small>收入</small><b class="money in" id="s-in"></b></div>
      <div><small>支出</small><b class="money out" id="s-out"></b></div>
      <div><small>日均支出</small><b class="money" id="s-avg"></b></div>
      <div><small>结余</small><b class="money" id="s-net"></b></div>
    </div>
  </section>

  <section class="panel" id="stats" aria-labelledby="stats-title">
    <div class="stats-heading">
      <h2 id="stats-title">统计</h2>
      <label class="check-row"><input id="exclude-oneoff" type="checkbox" role="switch">排除一次性大额</label>
    </div>
    <div class="choices stat-tabs" id="stat-tabs" role="tablist" aria-label="统计类型">
      <button class="choice" type="button" id="tab-composition" data-tab="composition" role="tab" aria-selected="true" aria-controls="stat-panel">构成</button>
      <button class="choice" type="button" id="tab-daily" data-tab="daily" role="tab" aria-selected="false" aria-controls="stat-panel" tabindex="-1">每日</button>
      <button class="choice" type="button" id="tab-monthly" data-tab="monthly" role="tab" aria-selected="false" aria-controls="stat-panel" tabindex="-1">月度</button>
      <button class="choice" type="button" id="tab-assets" data-tab="assets" role="tab" aria-selected="false" aria-controls="stat-panel" tabindex="-1">资产</button>
    </div>
    <div id="stat-panel" role="tabpanel" tabindex="0" aria-labelledby="tab-composition"></div>
  </section>

  <section class="panel" aria-labelledby="top-title">
    <h2 id="top-title">本月最大支出 Top5</h2>
    <div id="top-expense"></div>
  </section>

  <section class="panel" aria-labelledby="list-title">
    <h2 id="list-title" tabindex="-1">明细</h2>
    <div id="list"></div>
    <button class="more secondary" type="button" id="days-more" aria-controls="list" aria-expanded="false" hidden>展开更多</button>
    <p class="empty transfer-note">账户之间的转账不计入收入和支出。</p>
  </section>

  <details class="panel settings" id="account-management">
    <summary>账户管理</summary>
    <div class="settings-content">
      <div id="managed-accounts"></div>
      <p class="status" id="managed-msg" role="status"></p>
    </div>
  </details>
  <details class="panel settings" id="backup">
    <summary>备份</summary>
    <div class="settings-content">
      <p class="empty">账本数据保存在当前浏览器。换设备或清理浏览器前，请先生成并保存备份。</p>
      <textarea id="bk" aria-label="备份内容" spellcheck="false"></textarea>
      <div class="actions"><button type="button" id="exp">生成备份</button><button type="button" id="imp">从上面的内容恢复</button></div>
      <p class="status" id="backup-msg" role="status"></p>
    </div>
  </details>
</main>

<div class="fab-wrap"><button class="fab" type="button" id="open-entry" aria-label="记一笔" aria-haspopup="dialog">＋</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog class="sheet" id="entry" aria-labelledby="entry-title">
  <div class="sheet-panel" id="entry-panel">
    <header class="sheet-header"><h2 id="entry-title">记一笔</h2><button class="quiet" type="button" id="close-entry">关闭</button></header>
    <form id="entry-form" novalidate>
      <div class="entry-scroll" id="entry-scroll">
      <div class="choices" id="seg" role="group" aria-label="记账类型">
        <button class="choice" type="button" data-type="expense" aria-pressed="true">支出</button>
        <button class="choice" type="button" data-type="income" aria-pressed="false">收入</button>
        <button class="choice" type="button" data-type="transfer" aria-pressed="false">转账</button>
      </div>
      <div class="fields">
        <label>金额<input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required autofocus></label>
        <div>
          <label>日期<input id="date" type="date" required></label>
          <div class="date-shortcuts"><button type="button" id="date-today">今天</button><button type="button" id="date-yesterday">昨天</button></div>
        </div>
      </div>
      <fieldset><legend id="t-acc">从哪个账户付</legend><div class="choices" id="acc"></div></fieldset>
      <fieldset id="l-to" hidden><legend>转入账户</legend><div class="choices" id="to"></div></fieldset>
      <fieldset id="l-cat"><legend id="t-cat">分类</legend><div class="choices cat-choices" id="cat" aria-describedby="category-hint"></div><p class="category-hint" id="category-hint" aria-live="polite"></p></fieldset>
      <label class="check-row" id="entry-oneoff-row"><input type="checkbox" role="switch" id="entry-oneoff">一次性大额（不计入日常统计）</label>
      <label>备注<input id="note" placeholder="可不填"></label>
      </div>
      <div class="entry-footer">
      <p class="status" id="entry-msg" role="alert"></p>
      <button class="primary" type="submit" id="add">记下</button>
      </div>
    </form>
  </div>
</dialog>
<script>
const STORAGE_KEY = 'ledger-v1';
const PREFS_KEY = 'ledger-v1-prefs';
const demo = new URLSearchParams(location.search).get('demo') === '1';
const EXPENSE = ['餐饮','外卖','购物','日用','交通','居住','医疗','娱乐','游戏','订阅','学习','数码','人情红包','直播成本','其他'];
const INCOME = ['工资','直播','外卖返利','理财收益','退款','其他'];
const CATEGORY_HINTS = new Map([
  ['外卖','通过外卖平台下的单'],
  ['餐饮','堂食、买菜、奶茶咖啡、零食'],
  ['游戏','游戏充值、买游戏、游戏周边'],
  ['娱乐','电影、KTV、演出、玩乐（不含游戏）'],
  ['居住','房租、水电、网费、话费'],
  ['直播成本','直播相关的设备、软件、道具开销'],
  ['理财收益','余额宝、小荷包等的收益']
]);
const $ = id => document.getElementById(id);
const money = n => (Object.is(n, -0) ? 0 : n).toLocaleString('zh-CN', {
  minimumFractionDigits:2, maximumFractionDigits:2
});
const pad = n => String(n).padStart(2, '0');
function today(offset = 0) {
  const d = new Date();
  if (offset) d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// Put all displayed data in text nodes or form values, so it is never parsed as HTML.
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function button(text, className, run) {
  const node = element('button', text, className);
  node.type = 'button';
  node.addEventListener('click', run);
  return node;
}
function isLedger(value) {
  return Array.isArray(value?.accounts) && Array.isArray(value?.tx) &&
    value.accounts.every(a => a && ['number','string'].includes(typeof a.id) && typeof a.name === 'string') &&

  panel.append(statTools('本月每日支出'));
  if (!data.days.some(amount => amount > 0)) {
    panel.append(element('p', '本月没有可绘制的每日支出。', 'empty'));
    return;
  }
  const chart = makeChart('本月每日支出柱状图', '0 0 350 184', 'daily-svg');
  const {svg} = chart;
  const left = 42, right = 344, top = 12, bottom = 155;
  const step = niceStep(Math.max(...data.days));
  const maximum = Math.ceil(Math.max(...data.days) / step) * step;
  const height = value => value * (bottom - top) / maximum;
  for (let tick = 0; tick <= Math.round(maximum / step); tick++) {
    const value = tick * step;
    const y = bottom - height(value);
    svg.append(svgNode('line', {x1:left,y1:y,x2:right,y2:y,class:'chart-grid'}),
      svgNode('text', {x:left-4,y:y+4,'text-anchor':'end'}, compactAmount(value)));
  }
  const count = calendarDays(data.key);
  const slot = (right - left) / count;
  const bars = data.days.map((amount, index) => {
    const barHeight = amount > 0 ? Math.max(3, height(amount)) : 1;
    return bar(svg, left + slot * (index + 0.16), bottom - barHeight, slot * 0.68, barHeight,
      amount > 0 ? chartColor(1) : 'var(--line)');
  });
  for (const day of [1, 5, 10, 15, 20, 25, count]) {
    svg.append(svgNode('text', {x:left + slot * (day - 0.5),y:173,'text-anchor':'middle'}, day + '日'));
  }
  const averageY = bottom - height(data.average);
  svg.append(svgNode('line', {x1:left,y1:averageY,x2:right,y2:averageY,class:'average-line'}),
    svgNode('text', {x:right,y:averageY-4,'text-anchor':'end',class:'chart-value'}, '日均 ¥' + cents(data.average)));
  const highest = Math.max(...data.days);
  caption(chart, '本月已过 ' + data.days.length + ' 天，日均支出 ¥' + cents(data.average) +
    '，最高为 ' + (data.days.indexOf(highest) + 1) + ' 日的 ¥' + cents(highest) + '。');
  const tip = element('p', undefined, 'chart-tooltip');
  tip.setAttribute('role', 'status');
  const plot = element('div', undefined, 'chart-plot');
  chart.figure.prepend(plot);
  plot.append(svg, tip);
  const controls = element('div', undefined, 'day-controls');
  const previous = button('‹', 'icon quiet', () => setDay((selectedDay ?? 2) - 1));
  const next = button('›', 'icon quiet', () => setDay((selectedDay ?? 0) + 1));
  previous.setAttribute('aria-label', '查看前一天');
  next.setAttribute('aria-label', '查看后一天');
  controls.append(previous, element('span', '点选柱子查看当天'), next);
  const detail = element('div', undefined, 'stat-detail');
  function setDay(day, pointerY) {
    selectedDay = day;
    for (const [index, rect] of bars.entries()) rect.classList.toggle('selected-bar', index + 1 === day);
    previous.disabled = day === 1;
    next.disabled = day === data.days.length;
    tip.hidden = day === null;
    detail.hidden = day === null;
    if (day === null) return;
    const heading = Number(data.key.slice(5)) + '月' + day + '日';
    tip.textContent = heading + '共支出 ¥' + cents(data.days[day - 1]);
    const box = plot.getBoundingClientRect();
    const barBox = bars[day - 1].getBoundingClientRect();
    const center = barBox.left + barBox.width / 2 - box.left;
    const anchor = (pointerY ?? barBox.top) - box.top;
    const minTop = Math.max(0, -box.top);
    const maxTop = Math.max(minTop, Math.min(box.bottom, window.innerHeight) - box.top - tip.offsetHeight);
    tip.style.left = Math.max(0, Math.min(center - tip.offsetWidth / 2, box.width - tip.offsetWidth)) + 'px';
    tip.style.top = Math.max(minTop, Math.min(anchor - tip.offsetHeight - 6, maxTop)) + 'px';
    const date = data.key + '-' + pad(day);
    detailContents(detail, heading + '明细', data.entries.filter(t => t.date === date));
  }
  let pointerId = null;
  function point(event) {
    const box = svg.getBoundingClientRect();
    const x = (event.clientX - box.left) * 350 / box.width;
    if (x < left || x >= left + slot * data.days.length) return;
    const day = Math.floor((x - left) / slot) + 1;
    if (day !== selectedDay) setDay(day, event.clientY);
  }
  svg.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    pointerId = event.pointerId;
    svg.setPointerCapture(pointerId);
    point(event);
  });
  svg.addEventListener('pointermove', event => {
    if (event.pointerId === pointerId) point(event);
  });
  for (const name of ['pointerup','pointercancel','lostpointercapture']) {
    svg.addEventListener(name, () => { pointerId = null; });
  }
  panel.append(chart.figure, controls, detail);
  setDay(selectedDay);
}
function renderMonthly(panel, data) {
  const metric = monthlyMetric;
  const label = monthOptions.find(([value]) => value === metric)[1];
  panel.append(statTools('最近 6 个月', monthOptions, metric, value => {
    monthlyMetric = value;
    renderStatistics(data);
  }));
  const exclude = $('exclude-oneoff').checked;
  const months = Array.from({length:6}, (_, index) => index === 5 ? data : monthData(monthOffset(data.key, index - 5), exclude));
  const values = months.map(item => item.totals[metric]);
  if (!months.some(item => item.included.some(t => t.type !== 'transfer' && (metric === 'net' || t.type === metric)))) {
    panel.append(element('p', '最近 6 个月没有可统计的' + label + '。', 'empty'));
    return months;
  }
  const chart = makeChart('最近六个月' + label + '柱状图', '0 0 350 184', 'monthly-svg');
  const {svg} = chart;
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const y = value => 22 + (max - value) * 113 / (max - min || 1);
  const baseline = y(0);
  svg.append(svgNode('line', {x1:0,y1:baseline,x2:350,y2:baseline,class:'chart-grid'}));
  const hits = element('div', undefined, 'month-hits');
  for (const [index, item] of months.entries()) {
    const x = (index + 0.5) * 350 / 6;
    const value = values[index];
    const selected = item.key === month;
    const plotted = y(value);
    const height = Math.max(value ? 3 : 1, Math.abs(plotted - baseline));
    const barTop = value < 0 ? baseline : baseline - height;
    bar(svg, x - 15, barTop, 30, height, chartColor(1), selected);
    svg.append(svgNode('text', {x, y:barTop-5, 'text-anchor':'middle', class:'chart-value'}, compactAmount(value)),
      svgNode('text', {x, y:165, 'text-anchor':'middle', class:selected ? 'chart-value' : ''},
        item.key.slice(2, 4) + '/' + item.key.slice(5)));
    const hit = button(undefined, '', () => {
      selectMonth(item.key);
      $('stat-panel').querySelector('[aria-current="date"]')?.focus({preventScroll:true});
    });
    hit.setAttribute('aria-label', item.key + ' ' + label + ' ¥' + cents(value));
    if (selected) hit.setAttribute('aria-current', 'date');
    hits.append(hit);
  }
  const plot = element('div', undefined, 'chart-plot');
  chart.figure.prepend(plot);
  plot.append(svg, hits);
  caption(chart, '最近六个月' + label + '：' + months.map((item, index) =>
    item.key + ' ¥' + cents(values[index])).join('、') + '。');
  panel.append(chart.figure);
  return months;
}
function renderAssets(panel) {
  panel.append(statTools('当前账户资产'));
  const amounts = balances();
  const accounts = state.accounts.map((account, index) => ({
    name:account.name, amount:Math.round(amounts.get(account.id) * 100) / 100, color:chartColor(index)
  }));
  const positive = accounts.filter(row => row.amount > 0);
  const total = positive.reduce((sum, row) => sum + row.amount, 0);
  if (total > 0) {
    const chart = makeChart('当前资产按账户分布的堆叠条', '0 0 350 22', 'asset-svg');
    let used = 0;
    for (const row of positive) {
      const width = 350 * row.amount / total;
      chart.svg.append(svgNode('rect', {x:used, y:2, width, height:18, fill:row.color}));
      used += width;
    }
    caption(chart, '正余额合计 ¥' + cents(total) + '：' + positive.map(row =>
      row.name + ' ' + percent(row.amount, total)).join('、') + '。');
    panel.append(chart.figure);
  } else {
    panel.append(element('p', '暂无正余额可绘制资产构成。', 'empty'));
  }
  for (const row of accounts) {
    const item = element('div', undefined, 'asset-row');
    const name = element('div');
    const dot = element('span', undefined, 'asset-dot');
    dot.style.backgroundColor = row.amount > 0 ? row.color : 'var(--line)';
    name.append(dot, document.createTextNode(row.name),
      element('small', row.amount < 0 ? '负余额' : total ? percent(row.amount, total) : '占比 —'));
    item.append(name, element('b', '¥' + cents(row.amount), row.amount < 0 ? 'money out' : 'money'));
    panel.append(item);
  }
}
function renderStatistics(data = monthData(month, $('exclude-oneoff').checked)) {
  const panel = $('stat-panel');
  panel.setAttribute('aria-labelledby', 'tab-' + statTab);
  panel.replaceChildren();
  let range = [data];
  if (statTab === 'composition') renderComposition(panel, data);
  else if (statTab === 'daily') renderDaily(panel, data);
  else if (statTab === 'monthly') range = renderMonthly(panel, data);
  else renderAssets(panel);
  if (statTab !== 'assets' && $('exclude-oneoff').checked) {
    const skipped = range.reduce((sum, item) => ({
      count:sum.count + item.skipped.count, amount:sum.amount + item.skipped.amount
    }), {count:0, amount:0});
    const note = element('p', '已排除 ' + skipped.count + ' 笔，共 ¥' + cents(skipped.amount), 'chart-note');
    note.id = 'exclusion-note';
    const chart = panel.querySelector('.chart-figure');
    if (chart) chart.after(note);
    else panel.append(note);
  }
}
const tabButtons = [...$('stat-tabs').children];
function activateTab(control) {
  statTab = control.dataset.tab;
  for (const tab of tabButtons) {
    tab.setAttribute('aria-selected', String(tab === control));
    tab.tabIndex = tab === control ? 0 : -1;
  }
  renderStatistics();
}
for (const tab of tabButtons) tab.addEventListener('click', () => activateTab(tab));
$('stat-tabs').addEventListener('keydown', event => {
  const current = tabButtons.indexOf(document.activeElement);
  const index = {
    ArrowLeft:(current + tabButtons.length - 1) % tabButtons.length,
    ArrowRight:(current + 1) % tabButtons.length,
    Home:0, End:tabButtons.length - 1
  }[event.key];
  if (index === undefined) return;
  event.preventDefault();
  activateTab(tabButtons[index]);
  tabButtons[index].focus();
});

function renderChoices(id, options, current, select) {

  const group = $(id);
  const previousFocus = [...group.children].indexOf(document.activeElement);
  group.replaceChildren(...options.map(({value, label}) => {
    const choice = button(label, 'choice', () => {
      select(value);
      $('entry-msg').textContent = '';
      if (document.activeElement !== choice) choice.focus({preventScroll:true});
      renderEntry();
    });
    choice.setAttribute('aria-pressed', String(current === value));
    return choice;
  }));
  if (previousFocus >= 0) group.children[previousFocus]?.focus({preventScroll:true});
}
function renderEntry() {
  const accounts = state.accounts.map(a => ({value:a.id, label:a.name}));
  const selection = entrySelection[type];
  source = selection.account;
  if (!accounts.some(a => a.value === source)) source = accounts[0]?.value;
  if (!accounts.some(a => a.value === destination) || destination === source) {
    destination = accounts.find(a => a.value !== source)?.value;
  }
  const transfer = type === 'transfer';
  $('l-to').hidden = !transfer;
  $('l-cat').hidden = transfer;
  $('entry-oneoff-row').hidden = type !== 'expense';
  $('t-acc').textContent = transfer ? '转出账户' : type === 'income' ? '收入到' : '从哪个账户付';
  $('t-cat').textContent = type === 'income' ? '收入来源' : '分类';
  for (const tab of $('seg').children) tab.setAttribute('aria-pressed', String(tab.dataset.type === type));
  renderChoices('acc', accounts, source, value => { selection.account = value; });
  if (transfer) {
    const targets = accounts.filter(a => a.value !== source);
    renderChoices('to', targets, destination, value => { destination = value; });
  } else {
    const categories = type === 'income' ? INCOME : EXPENSE;
    if (!categories.includes(selection.category)) selection.category = categories[0];
    renderChoices('cat', categories.map(label => ({value:label,label})),
      selection.category, value => { selection.category = value; });
    const hint = CATEGORY_HINTS.get(selection.category);
    $('category-hint').textContent = hint ?? '';
    $('category-hint').hidden = !hint;
  }
}
$('seg').addEventListener('click', event => {
  const next = event.target.closest('button')?.dataset.type;
  if (!next) return;
  type = next;
  $('entry-msg').textContent = '';
  renderEntry();
});
const sheet = $('entry');
function fitEntryViewport() {
  if (!sheet.open || !window.visualViewport) return;
  sheet.style.setProperty('--entry-top', window.visualViewport.offsetTop + 'px');
  sheet.style.setProperty('--entry-height', window.visualViewport.height + 'px');
}
window.visualViewport?.addEventListener('resize', fitEntryViewport);
window.visualViewport?.addEventListener('scroll', fitEntryViewport);
$('date-today').addEventListener('click', () => { $('date').value = today(); });
$('date-yesterday').addEventListener('click', () => { $('date').value = today(-1); });
$('open-entry').addEventListener('click', () => {
  if (sheet.open) return;
  entrySelection = {expense:{...prefs.expense}, income:{...prefs.income}, transfer:{}};
  destination = undefined;
  $('date').value = today();
  $('entry-oneoff').checked = false;
  savedScroll = window.scrollY;
  document.body.style.top = `-${savedScroll}px`;
  document.body.classList.add('sheet-open');
  renderEntry();
  $('entry-msg').textContent = '';
  sheet.showModal();
  $('entry-scroll').scrollTop = 0;
  $('amt').focus({preventScroll:true});
  fitEntryViewport();
});
function closeEntry() {
  sheet.close();
  document.body.classList.remove('sheet-open');
  document.body.style.removeProperty('top');
  window.scrollTo(0, savedScroll);
  $('open-entry').focus({preventScroll:true});
}
$('close-entry').addEventListener('click', closeEntry);
sheet.addEventListener('cancel', event => {
  event.preventDefault();
  closeEntry();
});
let shadePress = false;
sheet.addEventListener('pointerdown', event => { shadePress = event.target === sheet; });
sheet.addEventListener('click', event => {
  if (shadePress && event.target === sheet) closeEntry();
  shadePress = false;
});
$('entry-form').addEventListener('submit', event => {
  event.preventDefault();
  const amount = Math.round(Number($('amt').value) * 100) / 100;
  const message = $('entry-msg');
  if (!(amount > 0) || !Number.isFinite(amount)) {
    message.textContent = '请先填写大于 0 的金额。';
    $('amt').focus();
    return;
  }
  if (source === undefined) {
    message.textContent = '请先添加账户。';
    return;
  }
  if (type === 'transfer' && (destination === undefined || source === destination)) {
    message.textContent = '转账需要两个不同的账户。';
    return;
  }
  const date = $('date').value || today();
  const ids = new Set(state.tx.map(t => String(t.id)));
  let id = Date.now();
  while (ids.has(String(id))) id++;
  const tx = {id, date, type, amt:amount, acc:source, note:$('note').value.trim()};
  if (type === 'transfer') tx.to = destination;
  else tx.cat = entrySelection[type].category;
  if (type === 'expense' && $('entry-oneoff').checked) tx.oneoff = true;
  if (!save({...state, tx:[...state.tx, tx]})) {
    message.textContent = storageError;
    return;
  }
  if (type !== 'transfer') {
    prefs[type] = {account:source, category:tx.cat};
    if (!demo) {
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
    }
  }
  const entryMonth = date.slice(0, 7);
  if (month !== entryMonth && entryMonth <= today().slice(0, 7)) {
    month = entryMonth;
    expandDays = false;
    selectedSlice = null;
    selectedDay = null;
  }
  $('amt').value = $('note').value = '';
  closeEntry();
  renderAccounts();
  renderMonth();
  showToast('已记下');
});

$('exp').addEventListener('click', () => {
  if (demo) return;
  const backup = $('bk');
  backup.value = JSON.stringify(state);
  backup.focus();
  backup.select();
  $('backup-msg').textContent = '备份已生成，可以复制保存。';
});
$('imp').addEventListener('click', () => {
  if (demo) return;
  const status = $('backup-msg');
  let backup;
  try {
    backup = JSON.parse($('bk').value);
    if (!isLedger(backup)) throw new Error();
  } catch {
    status.textContent = '备份内容无法识别，请检查后再试。';
    return;
  }
  if (!save(backup)) {
    status.textContent = storageError;
    return;
  }
  expandDays = false;
  selectedSlice = null;
  selectedDay = null;
  renderAccounts();
  renderManagement();
  renderMonth();
  status.textContent = '已从备份恢复。';
});
$('demo-banner').hidden = !demo;
if (demo) {
  $('exp').disabled = $('imp').disabled = $('bk').disabled = true;
  $('backup-msg').textContent = '演示模式下停用备份和恢复。';
}
renderAccounts();
renderManagement();
renderMonth();
</script>
</body>
</html>
